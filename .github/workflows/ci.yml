name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint, SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Bandit (static security analysis)
        run: bandit -c pyproject.toml -r ml services/model-service/model_service services/gateway/gateway
      - name: pip-audit (known CVEs in locked dependencies)
        run: |
          pip-audit -r services/model-service/requirements.txt --disable-pip --no-deps
          pip-audit -r services/gateway/requirements.txt --disable-pip --no-deps

  secret-scan:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing

  postgres-migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway database that only exists for this job, reachable on the runner only.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: machine_risk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/machine_risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r services/gateway/requirements.txt
      - working-directory: services/gateway
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  model-contract:
    name: Train model and block incompatible contract changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r services/model-service/requirements.txt
      - run: python -m ml.train --synthetic 1500 --fast --out artifacts
      - run: python -m ml.drift_check --baseline ml/baseline_contract.json --candidate artifacts/contract.json

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [test, lint-and-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: python3 scripts/generate_env.py --domain localhost
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through Caddy (HTTPS)
        run: |
          curl -fsSk https://localhost/health
          curl -fsSk https://localhost/ready
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/predictions)
          test "$code" = "401"
          python3 - <<'EOF'
          import json, ssl, urllib.request
          ctx = ssl._create_unverified_context()  # Caddy's local CA in CI only
          def call(path, body=None, token=None):
              req = urllib.request.Request("https://localhost" + path, method="POST" if body else "GET",
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Content-Type": "application/json",
                                                    **({"Authorization": f"Bearer {token}"} if token else {})})
              with urllib.request.urlopen(req, context=ctx) as resp:
                  return json.load(resp)
          creds = {"email": "smoke@example.com", "password": "smoke-test-password-1"}
          call("/api/v1/auth/register", creds)
          token = call("/api/v1/auth/login", creds)["access_token"]
          features = {"machine_type": "pump", "temperature_c": 61.5, "vibration_mm_s": 3.1,
                      "pressure_bar": 4.8, "rpm": 1790, "operating_hours": 6400, "load_pct": 72.0}
          result = call("/api/v1/predictions", {"machine_id": "smoke-1", "features": features}, token)
          assert result["risk_level"] in {"Low", "Medium", "High"}, result
          print("smoke prediction:", result["risk_level"], result["model_version"])
          EOF
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
