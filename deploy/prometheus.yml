global:
  scrape_interval: 15s

# Metrics are served on port 9100 inside each container and are never
# published outside the internal Docker network.
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]
  - job_name: model-service
    static_configs:
      - targets: ["model-service:9100"]
