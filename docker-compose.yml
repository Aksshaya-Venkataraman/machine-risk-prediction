# Production stack:  Caddy (HTTPS) -> gateway -> model-service
#                                         |-> PostgreSQL, Redis
# Only Caddy publishes ports. Everything else lives on internal networks.
#
#   python scripts/generate_env.py      # writes .env with random secrets
#   docker compose up -d --build
#   docker compose --profile monitoring up -d   # adds Prometheus on 127.0.0.1:9090

name: machine-risk

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge]

  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?}:${APP_DB_PASSWORD:?}@db:5432/${APP_DB_NAME:?}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      MODEL_ADMIN_TOKEN: ${MODEL_ADMIN_TOKEN:?}
      MODEL_SERVICE_URL: http://model-service:8001
      ALLOWED_HOSTS: ${DOMAIN},gateway,localhost,127.0.0.1
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      # The gateway port is never published; only Caddy can reach it, so the
      # X-Forwarded-For header Caddy sets is trusted for per-client limits.
      FORWARDED_ALLOW_IPS: "*"
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-service:
        condition: service_healthy
    networks: [edge, backend]

  model-service:
    <<: *hardening
    build:
      context: .
      dockerfile: services/model-service/Dockerfile
    environment:
      ENVIRONMENT: production
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      MODEL_ADMIN_TOKEN: ${MODEL_ADMIN_TOKEN:?}
      ALLOWED_HOSTS: model-service,localhost,127.0.0.1
    expose: ["8001"]
    networks: [backend]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      APP_DB_NAME: ${APP_DB_NAME:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt: ["no-new-privileges:true"]
    networks: [backend, monitoring]

networks:
  edge: {}
  backend:
    internal: true
  monitoring: {}

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
